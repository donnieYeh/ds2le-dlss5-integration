name: Build and release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Keep line endings stable for MSYS2
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out source
        uses: actions/checkout@v5

      - name: Fetch pinned ReShade SDK headers for build only
        shell: pwsh
        run: |
          $reshadeCommit = '358c345ca2fe64f86e67c694f8379c356627adcb'
          $includeRoot = Join-Path $env:RUNNER_TEMP 'dlss5-bridge-include'
          $headerRoot = Join-Path $includeRoot 'reshade'
          New-Item -ItemType Directory -Force -Path $headerRoot | Out-Null
          $headers = @(
            'reshade_api.hpp',
            'reshade_api_device.hpp',
            'reshade_api_format.hpp',
            'reshade_api_pipeline.hpp',
            'reshade_api_resource.hpp',
            'reshade_events.hpp'
          )
          foreach ($header in $headers) {
            $uri = "https://raw.githubusercontent.com/crosire/reshade/$reshadeCommit/include/$header"
            Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile (Join-Path $headerRoot $header)
          }
          if (-not (Test-Path -LiteralPath (Join-Path $headerRoot 'reshade_events.hpp'))) {
            throw 'Pinned ReShade SDK headers were not downloaded.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "DLSS5_RESHADE_INCLUDE=$includeRoot"

      - name: Install MSYS2 UCRT64 linker and import libraries
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-crt

      - name: Reject bundled third-party or game binaries
        shell: pwsh
        run: |
          $badExtensions = @('.dll', '.addon64', '.rar', '.7z', '.zip')
          $allowedProjectArtifact = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'build-artifacts\pre-sr-nr\dlss5-bridge-pre-sr-nr.addon64'))
          $bad = Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              ($badExtensions -contains $_.Extension.ToLowerInvariant()) -and
              ([IO.Path]::GetFullPath($_.FullName) -ne $allowedProjectArtifact)
            }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "Forbidden bundled binary: $($_.FullName)" }
            exit 1
          }

      - name: Verify scene-validated carrier
        shell: pwsh
        run: |
          $carrier = Join-Path $env:GITHUB_WORKSPACE 'build-artifacts\pre-sr-nr\dlss5-bridge-pre-sr-nr.addon64'
          if (-not (Test-Path -LiteralPath $carrier -PathType Leaf)) { throw "Missing $carrier" }
          $expected = 'E4DE11B7FA31C5FE7682CFF8F33C158C9FB9C11EE7DB62CE2524FC823A241374'
          $actual = (Get-FileHash -LiteralPath $carrier -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) { throw "Unexpected scene-validated carrier hash: $actual" }
          $item = Get-Item -LiteralPath $carrier
          if ($item.Length -ne 516096) { throw "Unexpected carrier size: $($item.Length)" }
          if ($item.VersionInfo.FileVersion -ne '1.4.12.0') {
            throw "Unexpected carrier version: $($item.VersionInfo.FileVersion)"
          }
          Write-Output "Scene-validated carrier ready: $actual"

      - name: Verify MSYS2 import libraries
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $libDir = Join-Path $env:MSYS2_LOCATION 'ucrt64\lib'
          $required = @('libkernel32.a', 'libuser32.a', 'libgdi32.a', 'libcomctl32.a')
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $libDir $_) -PathType Leaf) }
          if ($missing) {
            throw "Missing MSYS2 import libraries in $libDir`: $($missing -join ', ')"
          }
          Write-Output "MSYS2 import libraries ready: $libDir"

      - name: Build proxy
        shell: pwsh
        env:
          DLSS5_LD: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\ld.exe
          DLSS5_LIB: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\lib
        run: cmd /c src\proxy\build.cmd

      - name: Build project pre-SR NR carrier
        shell: pwsh
        run: cmd /c src\bridge\build.cmd

      - name: Verify project PE outputs
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'src\proxy\DINPUT8.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing $dll" }
          $item = Get-Item -LiteralPath $dll
          if ($item.Length -lt 4096) { throw "DINPUT8.dll is unexpectedly small" }
          Get-FileHash -LiteralPath $dll -Algorithm SHA256
          $builtCarrier = Join-Path $env:GITHUB_WORKSPACE 'src\bridge\dlss5-bridge.addon64'
          if (-not (Test-Path -LiteralPath $builtCarrier -PathType Leaf)) { throw "Missing $builtCarrier" }
          $carrierItem = Get-Item -LiteralPath $builtCarrier
          if ($carrierItem.Length -lt 400000) { throw "Bridge carrier is unexpectedly small" }
          if ($carrierItem.VersionInfo.FileVersion -ne '1.4.12.0') {
            throw "Unexpected bridge carrier version: $($carrierItem.VersionInfo.FileVersion)"
          }
          Get-FileHash -LiteralPath $builtCarrier -Algorithm SHA256

      - name: Create player package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
        run: .\tools\package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Audit player package boundary
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'dist') -Filter '*.zip' -File
          if ($zip.Count -ne 1) { throw "Expected exactly one package zip, found $($zip.Count)" }
          $audit = Join-Path $env:RUNNER_TEMP 'release-package-audit'
          if (Test-Path -LiteralPath $audit) { Remove-Item -LiteralPath $audit -Recurse -Force }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $audit
          $allowedBinaries = @('DINPUT8.dll', 'dlss5-bridge.addon64')
          $bad = Get-ChildItem -LiteralPath $audit -Recurse -File |
            Where-Object {
              $_.Extension.ToLowerInvariant() -in @('.dll', '.addon64', '.rar', '.7z') -and
              $_.Name -notin $allowedBinaries
            }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "Forbidden runtime in package: $($_.FullName)" }
            exit 1
          }
          $required = @('DINPUT8.dll', 'dlss5-bridge.addon64', 'dlss5-bridge.cfg.example')
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $audit $name) -PathType Leaf)) {
              throw "Required project file missing from package: $name"
            }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter '*.zip' -File
          $sums = Get-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'dist\SHA256SUMS.txt')
          if ($zip.Count -ne 1) { throw "Expected exactly one zip, found $($zip.Count)" }

          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $zip.FullName $sums.FullName --repo $env:GH_REPO --clobber
          } else {
            gh release create $env:RELEASE_TAG $zip.FullName $sums.FullName `
              --repo $env:GH_REPO `
              --title "DS2LE DLSS5 Integration $env:RELEASE_TAG" `
              --generate-notes `
              --verify-tag
          }
